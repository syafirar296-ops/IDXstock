      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<meta name="theme-color" content="#ffffff">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="IDX Stock">
<link id="appIcon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Ccircle cx='256' cy='256' r='134' fill='none' stroke='%23fff' stroke-width='32'/%3E%3C/svg%3E">
<link id="appleIcon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Ccircle cx='256' cy='256' r='134' fill='none' stroke='%23fff' stroke-width='32'/%3E%3C/svg%3E">
<script>
/* =====================================================
   PWA SINGLE-FILE
   - Logo mengikuti desain: cincin + 2 titik
   - Manifest dibuat otomatis
   - Mendukung tombol Install / Add to Home Screen
===================================================== */
(function(){
  function makeIcon(size){
    var c=document.createElement('canvas');
    c.width=c.height=size;
    var x=c.getContext('2d');
    x.fillStyle='#000';
    x.fillRect(0,0,size,size);

    var s=size/512;
    x.strokeStyle='#fff';
    x.lineWidth=32*s;
    x.lineCap='butt';
    x.beginPath();
    x.arc(256*s,256*s,134*s,0,Math.PI*2);
    x.stroke();

    /* gap/overlap area is naturally covered by the large dot */
    x.fillStyle='#fff';
    x.beginPath();
    x.arc(380*s,125*s,67*s,0,Math.PI*2);
    x.fill();

    x.beginPath();
    x.arc(438*s,391*s,25*s,0,Math.PI*2);
    x.fill();

    return c.toDataURL('image/png');
  }

  try{
    var i192=makeIcon(192), i512=makeIcon(512);
    var apple=makeIcon(180);

    document.getElementById('appleIcon').href=apple;
    document.getElementById('appIcon').href=i192;
    document.getElementById('appIcon').type='image/png';

    var base=location.href.split('#')[0].split('?')[0];
    var manifest={
      name:'IDX Stock Cloud',
      short_name:'IDX Stock',
      description:'IDX Stock Cloud — pencarian & harga saham Indonesia (BEI)',
      start_url:base,
      scope:base.replace(/[^\/]*$/,''),
      id:base,
      display:'standalone',
      orientation:'portrait',
      background_color:'#000000',
      theme_color:'#000000',
      prefer_related_applications:false,
      icons:[
        {src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},
        {src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}
      ]
    };

    var l=document.createElement('link');
    l.rel='manifest';
    l.href=URL.createObjectURL(
      new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'})
    );
    document.head.appendChild(l);
  }catch(e){
    console.warn('PWA setup failed',e);
  }
})();
</script>

/* =====================================================
   stock
===================================================== */

.stockCard{
  position:absolute;

  left:0;
  top:0;

  width:var(--size);
  height:var(--size);

  border-radius:50%;

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;

  will-change:
    transform,
    width,
    height;

  cursor:grab;

  transform:
    translate3d(
      var(--x),
      var(--y),
      0
    )
    rotate(
      var(--rot)
    )
    scale(var(--pulse,1));

  z-index:10;
}

.stockCard.dragging{
  z-index:60000;
  cursor:grabbing;
}

.stockBody{
  position:relative;

  width:100%;
  height:100%;

  border-radius:50%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:calc(var(--size) * .012);

  overflow:hidden;

  border:
    1px solid
    rgba(120,126,132,.85);

  background:
    radial-gradient(
      circle at 35% 25%,
      rgba(180,185,190,.12),
      rgba(18,18,18,.91) 62%,
      #000 100%

  box-shadow:
    inset 0 0 15px
    rgba(190,195,200,.055),

    0 0 13px
    rgba(180,185,190,.025);

  pointer-events:none;
}

.stockBody::after{
  content:"";

  position:absolute;
  inset:calc(var(--size) * .025);

  border-radius:50%;

  border:
    1px solid
    rgba(180,185,190,.08);
}

.stockLogo{
  width:44%;
  height:44%;

  min-height:0;

  max-width:none;
  max-height:none;

  border-radius:50%;

  object-fit:contain;

  background:#000;

  border:

  padding:1px;
}

.stockSymbol{
  width:96%;
  margin-top:2px;

  text-align:center;

  font-size:

.stockPrice{

<script>

/* =====================================================

const IDX_LIST=[];

/* CACHE: simpan semua saham di localStorage, request TradingView maksimal tiap 5 menit */

const CACHE_MS=5*60*1000; /* cache & refresh tiap 5 menit */
let lastAttemptTs=0;
function readStockCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY); if(!raw)return null;
    const c=JSON.parse(raw);
    if(c&&Array.isArray(c.stocks)&&c.stocks.length&&Number.isFinite(c.ts))return c;
  }catch(e){}
  return null;
}
function writeStockCache(){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),stocks:allStocks}));}catch(e){}
}
function indexStocks(){
  stockMap.clear(); stockBySymbol.clear();
  allStocks.forEach((stock,index)=>{stock.market_cap_rank=index+1;stockMap.set(stock.id,stock);stockBySymbol.set(stock.symbol.toUpperCase(),stock);});
}

let positions = new Map();

let nodes = new Map();

let stockMap = new Map();
let stockBySymbol = new Map();


/* =====================================================
   DOM
===================================================== */

const cloud =
  document.getElementById(
    'cloud'
  );

const pageButton =
  document.getElementById(
    'pageButton'
  );

const pageMenu =
  document.getElementById(
    'pageMenu'
  );


/* =====================================================
   FORMAT
===================================================== */

function price(v){

  if(v == null)
    return '—';

  v=Number(v);

  if(v>=1000)
    return 'Rp '+
      v.toLocaleString(
        'id-ID',
        {
          maximumFractionDigits:1
        }
      );

  if(v>=1)
    return 'Rp '+
      v.toLocaleString(
        'id-ID',
        {
          maximumFractionDigits:3
        }
      );

  if(v>=0.01)
    return 'Rp '+
      v.toLocaleString(
        'id-ID',
        {
          maximumFractionDigits:4
        }
      );

  return 'Rp '+
    v.toLocaleString(
      'id-ID',
      {
        maximumFractionDigits:8
      }
    );
}


function percent(v){

  if(v==null)
    return '—';

  v=Number(v);

  return (
    v>=0
      ?'+'
      :''
  )+
  v.toFixed(2)+
  '%';
}


function large(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return 'Rp '+
      (v/1e12).toFixed(2)+
      'T';

  if(v>=1e9)
    return 'Rp '+
      (v/1e9).toFixed(2)+
      'B';

  if(v>=1e6)
    return 'Rp '+
      (v/1e6).toFixed(2)+
      'M';

  if(v>=1e3)
    return 'Rp '+
      (v/1e3).toFixed(2)+
      'K';

  return 'Rp '+
    v.toLocaleString();
}


function supply(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return (v/1e12).toFixed(2)+'T';

  if(v>=1e9)
    return (v/1e9).toFixed(2)+'B';

  if(v>=1e6)
    return (v/1e6).toFixed(2)+'M';

  return v.toLocaleString(
    'en-US',
    {
      maximumFractionDigits:0
    }
  );
}


/* =====================================================
   stock SIZE BASED ON GAIN
===================================================== */

function sizeFromGain(gain){

  const g=
    Math.min(
      Math.abs(
        Number(gain)||0
      ),
      100
    );

  const n=
    Math.pow(
      g/100,
      .48
    );

  return Math.round(
    MIN_SIZE+
    (
      MAX_SIZE-
      MIN_SIZE
    )*n
  );
}


/* =====================================================
   RANDOM
===================================================== */

function random(min,max){

  return Math.random()*
    (max-min)+min;
}


/* =====================================================
   VIEW MODE: bubble / list (tetap di halaman utama)
===================================================== */
let viewMode='bubble';
const listRows=new Map();
function setViewMode(mode){
  viewMode=mode;
  document.querySelector('.app').classList.toggle('listMode',mode==='list');
  pageMenu.querySelectorAll('.viewBtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  if(mode==='list'){renderStockList();const l=document.getElementById('stockList');if(l)l.scrollTop=0;}
}
let listSource='own';            // 'own' = dropdown + funnel, 'menu' = filter dari menu
let listRankStart=1;             // 1,101,...,901
let listSort='marketcap';        // marketcap | trending | gainer | loser
const SORT_LABELS={trending:'Trending',gainer:'Gainer',loser:'Loser',marketcap:'Marketcap'};
function getListStocks(){
  if(listSource==='menu')return visibleStocks;
  const base=allStocks.slice(listRankStart-1,listRankStart+99);
  const g=c=>Number(c.price_change_percentage_24h)||0;
  if(listSort==='gainer')base.sort((a,b)=>g(b)-g(a));
  else if(listSort==='loser')base.sort((a,b)=>g(a)-g(b));
  else if(listSort==='trending')base.sort((a,b)=>(Number(b.total_volume)||0)-(Number(a.total_volume)||0));
  else base.sort((a,b)=>(Number(b.market_cap)||0)-(Number(a.market_cap)||0));
  return base;
}
function renderStockList(){
  const box=document.getElementById('listRows'), scroller=document.getElementById('stockList'); if(!box)return;
  const keep=scroller?scroller.scrollTop:0;
  listRows.clear(); box.innerHTML='';
  const frag=document.createDocumentFragment();
  getListStocks().forEach(stock=>{
    const row=document.createElement('div'); row.className='stockRow';
    const img=document.createElement('img'); img.alt=''; img.loading='lazy'; setReliableLogo(img,stock.symbol);
    const info=document.createElement('div'); info.className='rInfo';
    const sym=document.createElement('div'); sym.className='rSym'; sym.textContent=stock.symbol.toUpperCase();
    const nm=document.createElement('div'); nm.className='rName'; nm.textContent=stock.name;
    info.appendChild(sym); info.appendChild(nm);
    const right=document.createElement('div'); right.className='rRight';
    const pr=document.createElement('div'); pr.className='rPrice';
    const gn=document.createElement('div'); gn.className='rGain';
    right.appendChild(pr); right.appendChild(gn);
    const star=document.createElement('button'); star.className='rStar'+(localStorage.getItem('fav_'+stock.id)==='1'?' active':'');
    star.setAttribute('aria-label','Favorite'); star.title='Favorite';
    star.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3.8l2.55 5.17 5.7.83-4.13 4.03.98 5.68L12 16.83l-5.1 2.68.98-5.68-4.13-4.03 5.7-.83L12 3.8z"/></svg>';
    star.onclick=(e)=>{
      e.stopPropagation();
      const key='fav_'+stock.id, on=localStorage.getItem(key)==='1';
      localStorage.setItem(key,on?'0':'1');
      star.classList.toggle('active',!on);
    };
    row.appendChild(img); row.appendChild(info); row.appendChild(right); row.appendChild(star);
    row.onclick=()=>openPopup(stock.id);
    listRows.set(stock.id,{pr,gn,star});
    fillListRow(stock,pr,gn);
    frag.appendChild(row);
  });
  box.appendChild(frag);
  if(scroller)scroller.scrollTop=keep;
}
function initListBar(){
  const btn=document.getElementById('listSortBtn'),
        menu=document.getElementById('listSortMenu'), label=document.getElementById('listSortLabel'),
        rBtn=document.getElementById('listRankBtn'), rMenu=document.getElementById('listRankMenu'), rLabel=document.getElementById('listRankLabel');
  const closeRank=()=>{rMenu.classList.remove('show');rBtn.classList.remove('open');};
  const fillRank=()=>{
  rMenu.innerHTML='';
  for(let st=1;st<=TOTAL_STOCKS;st+=100){
    const o=document.createElement('button'); o.className='sortOpt'+(st===1?' active':''); o.dataset.st=st; o.textContent=st+' – '+Math.min(st+99,TOTAL_STOCKS);
    o.onclick=()=>{
      listSource='own';listRankStart=st;rLabel.textContent=o.textContent;
      rMenu.querySelectorAll('.sortOpt').forEach(x=>x.classList.toggle('active',x===o));
      closeRank();paint();renderStockList();document.getElementById('stockList').scrollTop=0;
    };
    rMenu.appendChild(o);
  }
  };
  fillRank(); window.__fillRank=fillRank;
  rBtn.onclick=(e)=>{e.stopPropagation();menu.classList.remove('show');btn.classList.remove('open');const o=rMenu.classList.toggle('show');rBtn.classList.toggle('open',o);};
  const paint=()=>{
    label.textContent=SORT_LABELS[listSort];
    menu.querySelectorAll('.sortOpt').forEach(b=>b.classList.toggle('active',listSource==='own'&&b.dataset.k===listSort));
  };
  Object.keys(SORT_LABELS).forEach(k=>{
    const b=document.createElement('button'); b.className='sortOpt'; b.dataset.k=k; b.textContent=SORT_LABELS[k];
    b.onclick=()=>{listSource='own';listSort=k;closeRank();menu.classList.remove('show');btn.classList.remove('open');paint();renderStockList();document.getElementById('stockList').scrollTop=0;};
    menu.appendChild(b);
  });
  btn.onclick=(e)=>{e.stopPropagation();closeRank();const o=menu.classList.toggle('show');btn.classList.toggle('open',o);};
  document.addEventListener('click',()=>{closeRank();menu.classList.remove('show');btn.classList.remove('open');});
  paint();
}
initListBar();
function fillListRow(stock,pr,gn){
  const g=Number(stock.price_change_percentage_24h)||0;
  pr.textContent=price(stock.current_price);
  gn.textContent=percent(g);
  gn.className='rGain '+(g>=0?'up':'down');
}
function updateListRow(stock){
  const r=listRows.get(stock.id); if(r)fillListRow(stock,r.pr,r.gn);
}

/* =====================================================
   PAGE MENU
===================================================== */

function createPageMenu(){
  pageMenu.innerHTML='';

  const ICON={
    all:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>',
    trending:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
    gainer:'<svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>',
    looser:'<svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg>',
    favorite:'<svg viewBox="0 0 24 24"><path d="M12 3.8l2.55 5.17 5.7.83-4.13 4.03.98 5.68L12 16.83l-5.1 2.68.98-5.68-4.13-4.03 5.7-.83L12 3.8z"/></svg>'
  };

  const head=document.createElement('div');
  head.className='menuHead';
  const title=document.createElement('div');
  title.className='menuTitle';
  title.textContent='IDX Stock';
  head.appendChild(title);
  const BUBBLE_SVG='<svg viewBox="0 0 24 24"><circle cx="9" cy="14.5" r="5.5"/><circle cx="17" cy="7.5" r="3.5"/><circle cx="18" cy="16.5" r="2"/></svg>';
  const LIST_SVG='<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>';
  [['bubble',BUBBLE_SVG,'Bubble'],['list',LIST_SVG,'List']].forEach(([mode,svg,label])=>{
    const vb=document.createElement('button');
    vb.className='viewBtn'+(viewMode===mode?' active':'');
    vb.dataset.mode=mode; vb.setAttribute('aria-label',label); vb.innerHTML=svg;
    vb.onclick=()=>{setViewMode(mode);setMenuOpen(false);};
    head.appendChild(vb);
  });

  const favoriteHead=document.createElement('button');
  favoriteHead.className='viewBtn favoriteHeadBtn';
  favoriteHead.setAttribute('aria-label','Favorite');
  favoriteHead.title='Favorite';
  favoriteHead.innerHTML=ICON.favorite;
  favoriteHead.onclick=()=>{
    favoriteHead.classList.toggle('active');
    applyMarketFilter('Favorite');
    setMenuOpen(false);
  };
  head.appendChild(favoriteHead);

  pageMenu.appendChild(head);

  const makeRow=(labelText)=>{
    const sec=document.createElement('div'); sec.className='menuSection';
    if(labelText){
      const l=document.createElement('div'); l.className='menuSectionLabel'; l.textContent=labelText; sec.appendChild(l);
    }
    const row=document.createElement('div'); row.className='tabRow';
    sec.appendChild(row); pageMenu.appendChild(sec);
    return row;
  };
  const setActive=(row,btn,work)=>{
    const cur=row.querySelector('.tabItem.active');
    if(cur&&cur!==btn)cur.classList.remove('active');
    btn.classList.add('active');
    // warna langsung berubah; render ditunda satu frame agar tap terasa instan
    requestAnimationFrame(()=>{
      work();
      btn.scrollIntoView({behavior:'auto',inline:'center',block:'nearest'});
    });
  };

  // Sub title: All stock / Trending / Gainer / Looser / Favorite (icon + text)
  const mainRow=makeRow();
  [
    ['All stock','all'],
    ['Trending','trending'],
    ['Gainer','gainer'],
    ['Looser','looser']
  ].forEach(([name,icon],i)=>{
    const b=document.createElement('button');
    b.className='tabItem'+(i===0?' active':'');
    b.innerHTML=ICON[icon]+'<span>'+name+'</span>';
    b.onclick=()=>setActive(mainRow,b,()=>applyMarketFilter(name));
    mainRow.appendChild(b);
  });

  // Ranking: slider horizontal 1-100, 101-200, 201-300, ...
  const rankSec=document.createElement('div');
  rankSec.className='menuSection';
  const rankLabel=document.createElement('div');
  rankLabel.className='menuSectionLabel';
  rankLabel.textContent='Ranking';
  rankSec.appendChild(rankLabel);

  const rankSliderSection=document.createElement('div');
  rankSliderSection.className='rankSliderSection';

  const rankValue=document.createElement('div');
  rankValue.className='rankSliderValue';

  const rankSlider=document.createElement('div');
  rankSlider.className='rankSlider';

  const rankTrack=document.createElement('div');
  rankTrack.className='rankSliderTrack';

  const rankInput=document.createElement('input');
  rankInput.type='range';
  rankInput.min='0';
  rankInput.max=String(Math.max(0,Math.ceil(TOTAL_STOCKS/100)-1));
  rankInput.step='1';
  rankInput.value='0';
  rankInput.setAttribute('aria-label','Ranking saham');
  rankInput.setAttribute('aria-valuemin','1');
  rankInput.setAttribute('aria-valuemax',String(TOTAL_STOCKS||100));

  const rankHint=document.createElement('div');
  rankHint.className='rankSliderHint';

  function updateRankSlider(shouldRender){
    const pages=Math.max(1,Math.ceil(TOTAL_STOCKS/100));
    const idx=Math.max(0,Math.min(Number(rankInput.value)||0,pages-1));
    const start=idx*100+1;
    const end=Math.min(start+99,TOTAL_STOCKS||100);
    const pct=pages<=1?0:(idx/(pages-1))*100;
    rankValue.textContent=`${start}–${end}`;
    rankTrack.style.setProperty('--rank-pct',pct+'%');
    rankTicks.forEach((t,i)=>t.classList.toggle('on',i<=idx));
    rankInput.setAttribute('aria-valuenow',String(start));
    if(shouldRender){
      const key=`${start}-${end}`;
      if(key!==rankInput._lastKey){
        rankInput._lastKey=key;
        cancelAnimationFrame(rankInput._raf);
        rankInput._raf=requestAnimationFrame(()=>applyTimeFilter('Rank '+key.replace('-','–')));
      }
    }
  }

  rankInput.addEventListener('input',()=>updateRankSlider(true));
  rankInput.addEventListener('change',()=>updateRankSlider(true));

  const tickPages=Math.max(1,Math.ceil(TOTAL_STOCKS/100));
  const rankTicks=[];
  for(let i=0;i<tickPages;i++){
    const t=document.createElement('i');
    t.className='rankTick';
    t.style.setProperty('--tick-p',tickPages<=1?0:i/(tickPages-1));
    rankTrack.appendChild(t);
    rankTicks.push(t);
  }
  rankSlider.appendChild(rankTrack);
  rankSlider.appendChild(rankInput);
  rankSliderSection.appendChild(rankValue);
  rankSliderSection.appendChild(rankSlider);

  const pages=Math.max(1,Math.ceil(TOTAL_STOCKS/100));
  rankHint.innerHTML=
    `<span>1–100</span><span>${pages>1?`${(pages-1)*100+1}–${Math.min(pages*100,TOTAL_STOCKS)}`:'1–100'}</span>`;
  rankSliderSection.appendChild(rankHint);

  rankSec.appendChild(rankSliderSection);
  pageMenu.appendChild(rankSec);
  updateRankSlider(false);
}

function applyMarketFilter(name){listSource='menu';let base=[...allStocks]; if(name==='Gainer')base.sort((a,b)=>(b.price_change_percentage_24h||0)-(a.price_change_percentage_24h||0)); if(name==='Looser')base.sort((a,b)=>(a.price_change_percentage_24h||0)-(b.price_change_percentage_24h||0)); if(name==='Favorite')base=base.filter(c=>localStorage.getItem('fav_'+c.id)==='1'); visibleStocks=base.slice(0,STOCKS_PER_PAGE); cloud.innerHTML='';nodes.clear();createPositions();visibleStocks.forEach(c=>cloud.appendChild(createStock(c)))}
let activeTimeFrame='1D';
function getLiveTimeframeGain(c,name){
  if(name==='1H')return Number(c.price_change_percentage_1h_in_currency)||0;
  if(name==='1D')return Number(c.price_change_percentage_24h)||0;
  if(name==='1W')return Number(c.price_change_percentage_7d_in_currency)||0;
  if(name==='1M')return Number(c.price_change_percentage_30d_in_currency)||0;
  // IDX Stock Data does not provide 4H/1Y in the markets endpoint used here.
  // Use the current 24H value as the live fallback until a historical source is available.
  return Number(c.price_change_percentage_24h)||0;
}
function applyTimeFilter(name){
  if(!allStocks.length)return;
  listSource='menu';
  if(name.startsWith('Rank')){
    activeTimeFrame='RANK';
    const m=name.match(/(\d+)[–-](\d+)/);
    const base=allStocks.slice(Number(m[1])-1,Number(m[2]));
    visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  }else{
    activeTimeFrame=name;
    const base=[...allStocks];
    base.sort((a,b)=>getLiveTimeframeGain(b,name)-getLiveTimeframeGain(a,name));
    visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  }
  cloud.innerHTML='';nodes.clear();createPositions();visibleStocks.forEach(c=>cloud.appendChild(createStock(c)));
}

function refreshActiveTimeframe(){
  if(!allStocks.length)return;
  if(activeTimeFrame==='RANK')return;
  const base=[...allStocks].sort((a,b)=>getLiveTimeframeGain(b,activeTimeFrame)-getLiveTimeframeGain(a,activeTimeFrame));
  visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  visibleStocks.forEach(c=>updateStock(c));

  }
}

/* =====================================================
   POSITIONS
===================================================== */

function createPositions(){

  renderStockList();

  positions.clear();

  const width=
    innerWidth;

  const height=
    innerHeight;

  const placed=[];

  visibleStocks.forEach(
    stock=>{

      const size=
        sizeFromGain(
          stock.price_change_percentage_24h
        );

      let x=0;
      let y=0;

      let found=false;

      for(
        let attempt=0;
        attempt<350;
        attempt++
      ){

        x=
          random(
            1,
            Math.max(
              2,
              width-size-1
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size-1
            )
          );

        let good=true;

        for(
          const p of placed
        ){

          const dx=
            (
              x+
              size/2
            )-
            (
              p.x+
              p.size/2
            );

          const dy=
            (
              y+
              size/2
            )-
            (
              p.y+
              p.size/2
            );

          const distance=
            Math.sqrt(
              dx*dx+
              dy*dy
            );

          const minimum=
            (
              size/2+
              p.size/2
            )*.78;

          if(
            distance<
            minimum
          ){

            good=false;

            break;

          }

        }

        if(good){

          found=true;

          break;

        }

      }

      if(!found){

        x=
          random(
            0,
            Math.max(
              1,
              width-size
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size
            )
          );

      }

      const p={

        x:x,
        y:y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        size:size,

        phaseX:
          Math.random()*
          Math.PI*2,

        phaseY:
          Math.random()*
          Math.PI*2,

        speedX:
          random(
            .00032,
            .00072
          ),

        speedY:
          random(
            .00028,
            .00068
          ),

        amplitudeX:
          random(2.0,5.0),

        amplitudeY:
          random(2.0,5.0),

        rotation:0,

        pulsePhase:
          Math.random()*
          Math.PI*2,

        pulseSpeed:
          random(
            .00065,
            .00125
          ),

        rotSpeed:
          random(
            .00012,
            .00032
          )

      };

      placed.push(p);

      positions.set(
        stock.id,
        p
      );

    }
  );

}


/* =====================================================
   CLAMP
===================================================== */

function clampPosition(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  p.x=
    Math.max(
      0,
      Math.min(
        maxX,
        p.x
      )
    );

  p.y=
    Math.max(
      SAFE_TOP,
      Math.min(
        maxY,
        p.y
      )
    );

}


function bounceFromEdges(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  const bounce=.82;

  if(
    p.x<=0
  ){

    p.x=0;

    if(p.vx<0)
      p.vx=
        -p.vx*bounce;

  }else if(
    p.x>=maxX
  ){

    p.x=maxX;

    if(p.vx>0)
      p.vx=
        -p.vx*bounce;

  }

  if(
    p.y<=SAFE_TOP
  ){

    p.y=SAFE_TOP;

    if(p.vy<0)
      p.vy=
        -p.vy*bounce;

  }else if(
    p.y>=maxY
  ){

    p.y=maxY;

    if(p.vy>0)
      p.vy=
        -p.vy*bounce;

  }

}


/* =====================================================
   APPLY
===================================================== */

function applyPosition(id){

  const p=
    positions.get(id);

  const node=
    nodes.get(id);

  if(
    !p ||
    !node
  )
    return;

  node.card.style.setProperty(
    '--x',
    p.x+'px'
  );

  node.card.style.setProperty(
    '--y',
    p.y+'px'
  );

  node.card.style.setProperty(
    '--size',
    p.size+'px'
  );

  node.card.style.setProperty(
    '--rot',
    p.rotation+'deg'
  );

  const pulse=
    1+
    Math.sin(
      performance.now()*
      p.pulseSpeed+
      p.pulsePhase
    )*.035;

  node.card.style.setProperty(
    '--pulse',
    pulse.toFixed(4)
  );

}

/* ---------- TRADINGVIEW (Scanner publik, semua saham IDX) ---------- */
const TV_SCAN_URL='https://scanner.tradingview.com/indonesia/scan';
const TV_COLS=['name','description','close','change','volume','market_cap_basic','high','low','logoid'];
function tvRowToQuote(r){
  const d=r.d||[]; const sym=String(d[0]||String(r.s||'').split(':')[1]||'').toUpperCase();
  return {symbol:sym,name:d[1]||sym,price:d[2],pct:d[3],vol:d[4],cap:d[5],high:d[6],low:d[7],logoid:d[8]||''};
}
async function tvScan(body){
  const payload=JSON.stringify(Object.assign({columns:TV_COLS},body));
  const post=u=>fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:payload});
  let r;
  try{r=await post(TV_SCAN_URL);}catch(e){r=null;}
  /* jika diblokir (CORS di GitHub Pages), coba lewat proxy */
  if(!r||!r.ok){
    for(const mk of [u=>'https://corsproxy.io/?'+encodeURIComponent(u),u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)]){
      try{const rr=await post(mk(TV_SCAN_URL)); if(rr.ok){r=rr;break;}}catch(e){}
    }
  }
  if(!r||!r.ok)throw new Error('TradingView HTTP '+(r?r.status:'gagal'));
  const j=await r.json(); return (j.data||[]).map(tvRowToQuote).filter(q=>q.symbol);
}
/* semua saham IDX di TradingView, urut market cap terbesar */
function fetchAllQuotes(){
  return tvScan({filter:[{left:'type',operation:'in_range',right:['stock']}],markets:['indonesia'],sort:{sortBy:'market_cap_basic',sortOrder:'desc'},range:[0,3000]});
}
/* dipakai pencarian untuk kode yang belum ada di daftar */
async function fetchQuotes(syms){
  const list=await tvScan({symbols:{tickers:syms.map(s=>'IDX:'+s),query:{types:[]}}});
  const map=new Map(); list.forEach(q=>{if(q.price>0)map.set(q.symbol,q);});
  if(!map.size)throw new Error('Data kosong'); return map;
}
function applyQuote(stock,q){
  if(q.price!=null)stock.current_price=q.price; if(q.pct!=null)stock.price_change_percentage_24h=q.pct;
  if(q.vol!=null)stock.total_volume=q.vol; if(q.cap!=null)stock.market_cap=q.cap;
  if(q.high!=null)stock.high_24h=q.high; if(q.low!=null)stock.low_24h=q.low;
  if(q.logoid)stock.logoid=q.logoid;
  if(q.name&&(stock.name===stock.symbol||!stock.name))stock.name=String(q.name);
}

let tvRefreshBusy=false;
async function refreshTradingViewPrices(force){
  if(tvRefreshBusy)return;
  if(!force&&Date.now()-lastAttemptTs<CACHE_MS)return; /* cache masih segar, tidak ambil data */
  tvRefreshBusy=true;
  try{
    const quotes=await fetchAllQuotes();
    if(quotes.length<100)throw new Error('Data terlalu sedikit');
    const prev=new Map(allStocks.map(s=>[s.symbol,s])), seen=new Set(), next=[]; let changed=quotes.length!==allStocks.length;
    quotes.forEach(q=>{
      if(seen.has(q.symbol))return; seen.add(q.symbol);
      let s=prev.get(q.symbol); if(!s){s=skeletonStock({symbol:q.symbol,name:q.name});changed=true;}
      applyQuote(s,q); next.push(s);
    });
    lastAttemptTs=Date.now();
    if(changed||quotes.some((q,i)=>!allStocks[i]||allStocks[i].symbol!==q.symbol)){
      allStocks=next; TOTAL_STOCKS=allStocks.length; indexStocks();
      if(window.__fillRank)window.__fillRank(); createPageMenu(); renderCurrentPage();
    }else{
      allStocks.forEach(stock=>{updateStock(stock);if(selectedStock&&selectedStock.id===stock.id)updatePopup(stock);});
    }
    writeStockCache();
    setLiveStatus('live','TRADINGVIEW '+new Date().toLocaleTimeString('id-ID')+' · '+allStocks.length+' saham');
  }catch(e){
    console.warn('TradingView gagal',e);
    setLiveStatus('error','TV: '+String(e&&e.message||e).slice(0,60));
  }finally{tvRefreshBusy=false;}
}
function connectStockData(){clearInterval(window.__tvRefreshTimer);window.__tvRefreshTimer=setInterval(refreshTradingViewPrices,CACHE_MS);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshTradingViewPrices();});


function updateStock(stock){

  updateListRow(stock);

  const node=
    nodes.get(
      stock.id
    );

  if(!node)
    return;

  node.priceEl.textContent=
    price(
      stock.current_price
    );

  const gain=
    Number(
      stock.price_change_percentage_24h
    )||0;

  node.gainEl.textContent=
    percent(gain);

  node.gainEl.className=
    'stockGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );

  if(node.body){
    node.body.classList.toggle('gainUp',gain>=0);
    node.body.classList.toggle('gainDown',gain<0);
  }

  const p=
    positions.get(
      stock.id
    );

  if(!p)
    return;

  const oldSize=
    p.size;

  const newSize=
    sizeFromGain(
      gain
    );

  if(
    Math.abs(
      oldSize-newSize
    )>=1
  ){

    const cx=
      p.x+
      oldSize/2;

    const cy=
      p.y+
      oldSize/2;

    p.size=
      newSize;

    p.x=
      cx-
      newSize/2;

    p.y=
      cy-
      newSize/2;

    p.homeX=
      p.x;

    p.homeY=
      p.y;

    clampPosition(p);

      stock.id

}


/* =====================================================
   DRAG
===================================================== */

function enableDrag(
  card,
  id
){

  let pointerId=null;

  let startPointerX=0;
  let startPointerY=0;

  let startX=0;
  let startY=0;

  let lastX=0;
  let lastY=0;

  let velocityX=0;
  let velocityY=0;

  let moved=false;

  card.addEventListener(
    'pointerdown',
    e=>{

      const p=
        positions.get(id);

      if(!p)
        return;

      pointerId=
        e.pointerId;

      card.setPointerCapture(
        pointerId
      );

      startPointerX=
        e.clientX;

      startPointerY=
        e.clientY;

      startX=p.x;
      startY=p.y;

      lastX=e.clientX;
      lastY=e.clientY;

      velocityX=0;
      velocityY=0;

      moved=false;

      drag={
        id:id
      };

      card.classList.add(
        'dragging'
      );

    },
    {
      passive:true
    }
  );

  card.addEventListener(
    'pointermove',
    e=>{

      if(
        pointerId!==
        e.pointerId
      )
        return;

      if(
        !drag ||
        drag.id!==id
      )
        return;

      const p=
        positions.get(id);

      if(!p)
        return;

      const dx=
        e.clientX-
        startPointerX;

      const dy=
        e.clientY-
        startPointerY;

      if(
        Math.abs(dx)>3 ||
        Math.abs(dy)>3
      ){

        moved=true;

      }

      p.x=
        startX+
        dx;

      p.y=
        startY+
        dy;

      clampPosition(p);

      velocityX=
        velocityX*.55+
        (
          e.clientX-
          lastX
        )*.45;

      velocityY=
        velocityY*.55+
        (
          e.clientY-
          lastY
        )*.45;

      lastX=e.clientX;
      lastY=e.clientY;

      p.rotation=
        Math.max(
          -7,
          Math.min(
            7,
            velocityX*.7
          )
        );

      pushNeighbors(
        id,
        velocityX,
        velocityY
      );

      applyPosition(id);

    },
    {
      passive:true
    }
  );

  function release(e){

    if(
      pointerId!==
      e.pointerId
    )
      return;

    pointerId=null;

    const p=
      positions.get(id);

    if(p){

      p.vx+=
        velocityX*.45;

      p.vy+=
        velocityY*.45;

      p.homeX=
        p.x;

      p.homeY=
        p.y;

      p.rotation=0;

    }

    card.classList.remove(
      'dragging'
    );

    const wasClick=
      !moved;

    drag=null;

    if(wasClick && (performance.now()-(window.__pdT||0))<600 && !window.__pausePhys){

      openPopup(id);

    }

  }

  card.addEventListener(
    'pointerup',
    release
  );

  card.addEventListener(
    'pointercancel',
    release
  );

}


/* =====================================================
   PUSH NEIGHBORS
===================================================== */

function pushNeighbors(
  movingId,
  vx,
  vy
){

  const moving=
    positions.get(
      movingId
    );

  if(!moving)
    return;

  positions.forEach(
    (other,id)=>{

      if(
        id===
        movingId
      )
        return;

      const dx=
        (
          other.x+
          other.size/2
        )-
        (
          moving.x+
          moving.size/2
        );

      const dy=
        (
          other.y+
          other.size/2
        )-
        (
          moving.y+
          moving.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          moving.size/2+
          other.size/2
        )*.92;

      if(
        distance<
        minimum
      ){

        const d=
          Math.max(
            distance,
            .001
          );

        const nx=
          dx/d;

        const ny=
          dy/d;

        const overlap=
          minimum-distance;

        const speed=
          Math.min(
            13,
            Math.sqrt(
              vx*vx+
              vy*vy
            )
          );

        const impulse=
          overlap*.95+
          speed*.42;

        other.vx+=
          nx*
          impulse;

        other.vy+=
          ny*
          impulse;

        other.rotation+=
          nx*
          impulse*
          .7;

        other.vx=
          Math.max(
            -8,
            Math.min(
              8,
              other.vx
            )
          );

        other.vy=
          Math.max(
            -8,
            Math.min(
              8,
              other.vy
            )
          );

        other.homeX+=
          nx*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        other.homeY+=
          ny*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        clampPosition(
          other
        );

      }

    }
  );

}


/* =====================================================
   FLOATING PHYSICS
===================================================== */

function animate(){

  if(window.__pausePhys){requestAnimationFrame(animate);return;}

  const now=
    performance.now();

  positions.forEach(
    (p,id)=>{

      const held=
        drag &&
        drag.id===
        id;

      if(!held){

        const fx=
          Math.sin(
            now*
            p.speedX+
            p.phaseX
          )*
          p.amplitudeX;

        const fy=
          Math.cos(
            now*
            p.speedY+
            p.phaseY
          )*
          p.amplitudeY;

        const targetX=
          p.homeX+
          fx;

        const targetY=
          p.homeY+
          fy;

        p.vx+=
          (
            targetX-
            p.x
          )*.012;

        p.vy+=
          (
            targetY-
            p.y
          )*.012;

        p.vx*=.93;
        p.vy*=.93;

        p.x+=p.vx;
        p.y+=p.vy;

        p.rotation=
          Math.sin(
            now*
            p.rotSpeed+
            p.phaseX
          )*2.2;

      }

      bounceFromEdges(p);

      clampPosition(p);

      applyPosition(id);

    }
  );

  collisionPhysics();

  requestAnimationFrame(
    animate
  );

}


/* =====================================================
   COLLISION
===================================================== */

function collisionPhysics(){

  const ids=
    Array.from(
      positions.keys()
    );

  for(
    let i=0;
    i<ids.length;
    i++
  ){

    const a=
      positions.get(
        ids[i]
      );

    if(!a)
      continue;

    for(
      let j=i+1;
      j<ids.length;
      j++
    ){

      const b=
        positions.get(
          ids[j]
        );

      if(!b)
        continue;

      const dx=
        (
          b.x+
          b.size/2
        )-
        (
          a.x+
          a.size/2
        );

      const dy=
        (
          b.y+
          b.size/2
        )-
        (
          a.y+
          a.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          a.size/2+
          b.size/2
        )*.82;

      if(
        distance<
        minimum &&
        distance>.001
      ){

        const nx=
          dx/
          distance;

        const ny=
          dy/
          distance;

        const overlap=
          minimum-
          distance;

        const push=
          overlap*.045;

        a.x-=
          nx*
          push;

        a.y-=
          ny*
          push;

        b.x+=
          nx*
          push;

        b.y+=
          ny*
          push;

        const bounce=
          .008;

        a.vx-=
          nx*
          bounce;

        a.vy-=
          ny*
          bounce;

        b.vx+=
          nx*
          bounce;

        b.vy+=
          ny*
          bounce;

        clampPosition(a);
        clampPosition(b);

      }

    }

  }

}

/* =====================================================
   IDX NEWS (100 berita terbaru, RSS Google News: IDX/BEI/saham)
===================================================== */
const NEWS_LIMIT=100, NEWS_CACHE_MS=5*60*1000;
const NEWS_RSS='https://news.google.com/rss/search?q='+encodeURIComponent('IDX OR BEI OR "Bursa Efek Indonesia" saham when:7d')+'&hl=id&gl=ID&ceid=ID:id';
const NEWS_PROXIES=[
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?'+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)
];
let newsCache=null, newsTs=0, newsBusy=false;

function timeAgo(d){
  const s=Math.max(0,(Date.now()-d.getTime())/1000);
  if(s<3600)return Math.max(1,Math.floor(s/60))+' menit lalu';
  if(s<86400)return Math.floor(s/3600)+' jam lalu';
  return Math.floor(s/86400)+' hari lalu';
}
async function fetchNews(){
  let lastErr;
  for(const mk of NEWS_PROXIES){
    try{
      const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),10000);
      const r=await fetch(mk(NEWS_RSS),{signal:ctl.signal}); clearTimeout(t);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const xml=new DOMParser().parseFromString(await r.text(),'text/xml');
      const items=[...xml.querySelectorAll('item')].map(it=>{
        const src=(it.querySelector('source')||{}).textContent||'';
        let title=(it.querySelector('title')||{}).textContent||'';
        if(src&&title.endsWith(' - '+src))title=title.slice(0,-(src.length+3));
        return {title:title,link:(it.querySelector('link')||{}).textContent||'',source:src,date:new Date((it.querySelector('pubDate')||{}).textContent||Date.now())};
      }).filter(n=>n.title&&n.link);
      if(!items.length)throw new Error('Kosong');
      items.sort((a,b)=>b.date-a.date);
      return items.slice(0,NEWS_LIMIT);
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('Gagal memuat');
}
function renderNews(list){
  const box=document.getElementById('newsList'); box.innerHTML='';
  const frag=document.createDocumentFragment();
  list.forEach(n=>{
    const a=document.createElement('a'); a.className='newsItem'; a.href=n.link; a.target='_blank'; a.rel='noopener';
    const t=document.createElement('div'); t.className='newsTitle'; t.textContent=n.title;
    const m=document.createElement('div'); m.className='newsMeta'; m.textContent=(n.source?n.source+' · ':'')+timeAgo(n.date);
    a.appendChild(t); a.appendChild(m); frag.appendChild(a);
  });
  box.appendChild(frag);
  document.getElementById('newsCount').textContent=list.length+' berita';
}
async function openNews(){
  let ov=document.getElementById('newsOverlay');
  if(!ov){
    ov=document.createElement('div'); ov.id='newsOverlay'; ov.className='newsOverlay';
    ov.innerHTML='<div class="newsPanel"><div class="newsHead"><div><div class="newsHeadTitle">IDX News</div><div id="newsCount" class="newsHeadSub"></div></div><button id="newsClose" class="newsClose" aria-label="Tutup">×</button></div><div id="newsList" class="newsListBox"></div></div>';
    document.querySelector('.app').appendChild(ov);
    document.getElementById('newsClose').onclick=()=>ov.classList.remove('show');
    ov.addEventListener('pointerdown',e=>{if(e.target===ov)ov.classList.remove('show');});
  }
  ov.classList.add('show');
  const box=document.getElementById('newsList');
  if(newsCache&&Date.now()-newsTs<NEWS_CACHE_MS){renderNews(newsCache);return;}
  if(newsBusy)return;
  newsBusy=true;
  box.innerHTML='<div class="newsState">Memuat berita…</div>';
  document.getElementById('newsCount').textContent='';
  try{
    newsCache=await fetchNews(); newsTs=Date.now(); renderNews(newsCache);
  }catch(e){
    box.innerHTML='<div class="newsState">Gagal memuat berita.<br><button class="newsRetry" id="newsRetry">Coba lagi</button></div>';
    document.getElementById('newsRetry').onclick=()=>{newsBusy=false;openNews();};
  }finally{newsBusy=false;}
}

<script>
/* Responsif + tap luar untuk menutup popup */
(function(){
  window.__pdT=0;
  document.addEventListener('pointerdown',function(){window.__pdT=performance.now();},true);
  var SEL='.overlay.show,.qrOverlay.show,.newsOverlay.show,.pageMenu.show,.landing:not(.hide)';
  function upd(){window.__pausePhys=!!document.querySelector(SEL);}
  try{new MutationObserver(upd).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});}catch(_){}
  upd();
  document.addEventListener('pointerdown',function(e){
    var m=document.getElementById('pageMenu');
    if(m&&m.classList.contains('show')&&!m.contains(e.target)&&!e.target.closest('#pageButton')){
      e.preventDefault();setMenuOpen(false);
    }
    var o=document.getElementById('overlay');
    if(o&&o.classList.contains('show')&&!e.target.closest('.popup')){
      window.__swallowClick=performance.now();
      e.preventDefault();e.stopPropagation();closePopup();
    }
    var nw=document.getElementById('newsOverlay');
    if(nw&&nw.classList.contains('show')&&!e.target.closest('.newsPanel')){nw.classList.remove('show');}
    var q=document.getElementById('qrOverlay');
    if(q&&q.classList.contains('show')&&!e.target.closest('.qrCard')&&!e.target.closest('#qrBtn')){q.classList.remove('show');}
  },true);
  /* buang klik susulan setelah tap-luar, supaya baris saham di bawahnya tidak membuka popup lagi */
  ['click','touchend','mouseup'].forEach(function(t){
    document.addEventListener(t,function(e){
      if(window.__swallowClick&&performance.now()-window.__swallowClick<450){
        e.stopPropagation();e.preventDefault();
      }
    },true);
  });
})();
</script>
<div id="exitToast" class="exitToast">Tekan back sekali lagi untuk keluar</div>
<script>
(function(){
  const landing=document.getElementById('landing'), toast=document.getElementById('exitToast');
  let onLanding=true, armed=false, armTimer=null, toastTimer=null;
  function showToast(){toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2000)}
  function closeAllPopups(){
    var any=false;
    var o=document.getElementById('overlay'); if(o&&o.classList.contains('show')){any=true; try{closePopup()}catch(_){o.classList.remove('show')}}
    ['qrOverlay','newsOverlay'].forEach(function(id){var el=document.getElementById(id); if(el&&el.classList.contains('show')){any=true; el.classList.remove('show');}});
    var m=document.getElementById('pageMenu'); if(m&&m.classList.contains('show')){any=true; try{setMenuOpen(false)}catch(_){m.classList.remove('show')}}
    document.querySelectorAll('.rankMenu.show,.sortMenu.show').forEach(function(el){any=true; el.classList.remove('show');});
    document.querySelectorAll('.rankBtn.open,.funnelBtn.open').forEach(function(el){el.classList.remove('open');});
    var sr=document.getElementById('searchResults'); if(sr&&sr.classList.contains('show')){any=true; try{closeSearch()}catch(_){sr.classList.remove('show')}}
    return any;
  }
  window.__closeAllPopups=closeAllPopups;
  // riwayat halaman (bubble/list) supaya tombol back mundur satu halaman
  let pages=[], restoring=false;
  const _origSet=window.setViewMode;
  if(typeof _origSet==='function'){
    window.setViewMode=function(m){
      _origSet(m);
      if(!restoring && !onLanding && pages.length && pages[pages.length-1]!==m) pages.push(m);
    };
  }
  function goBubble(){ if(!onLanding)return; onLanding=false; landing.classList.add('hide'); pages=[(typeof viewMode!=='undefined'?viewMode:'bubble')]; }
  function goLanding(){ closeAllPopups(); pages=[]; onLanding=true; landing.classList.remove('hide'); }
  // Gambar bisa digeser ke segala arah (melayang); geser ke bawah untuk masuk ke halaman bubble
  const hero=document.getElementById('heroDrag');
  document.getElementById('goBtn').addEventListener('click',goBubble);
  let dragging=false,px=0,py=0,dx=0,dy=0,lt=0,vy=0,pid=null;
  function setHero(x,y){
    const rot=Math.max(-14,Math.min(14,x/18));
    hero.style.transform='translate3d('+x+'px,'+y+'px,0) rotate('+rot+'deg) scale(1.03)';
  }
  hero.addEventListener('pointerdown',e=>{
    if(!onLanding)return; dragging=true; pid=e.pointerId; px=e.clientX; py=e.clientY; dx=dy=0; lt=performance.now(); vy=0;
    hero.classList.remove('spring'); hero.classList.add('dragging');
    try{hero.setPointerCapture(pid)}catch(_){}
  });
  hero.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const now=performance.now(), ndy=e.clientY-py;
    vy=(ndy-dy)/Math.max(1,now-lt); lt=now;
    dx=e.clientX-px; dy=ndy; setHero(dx,dy);
  });
  function endDrag(){
    if(!dragging)return; dragging=false; hero.classList.remove('dragging');
    if(dy>110||(dy>40&&vy>0.6)){ goBubble(); setTimeout(()=>{hero.classList.remove('spring');hero.style.transform=''},500); }
    else { hero.classList.add('spring'); hero.style.transform=''; }
  }
  hero.addEventListener('pointerup',endDrag);
  hero.addEventListener('pointercancel',endDrag);
  landing.addEventListener('wheel',e=>{if(e.deltaY<-10)goBubble()},{passive:true});
  document.addEventListener('keydown',e=>{if(onLanding&&e.key==='ArrowDown')goBubble()});
  // Tombol back: bubble -> landing -> (back 2x) keluar
  try{ history.replaceState({g:0},''); history.pushState({g:1},''); }catch(_){}
  window.addEventListener('popstate',()=>{
    if(closeAllPopups()){ try{history.pushState({g:1},'')}catch(_){} return; }
    if(!onLanding && pages.length>1){
      pages.pop(); restoring=true;
      try{ window.setViewMode(pages[pages.length-1]); }finally{ restoring=false; }
      try{history.pushState({g:1},'')}catch(_){} return;
    }
    if(!onLanding){ goLanding(); try{history.pushState({g:1},'')}catch(_){} return; }
    if(armed){ clearTimeout(armTimer); armed=false; try{history.back()}catch(_){} return; }
    armed=true; showToast(); try{history.pushState({g:1},'')}catch(_){}
    armTimer=setTimeout(()=>{armed=false},2000);
  });
})();
</script>
